<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHARA — A LIVING CITY</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f5ef;font-family:Arial,sans-serif;color:#123b35}canvas{display:block;width:100%;height:100%}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#f6f5ef;padding:25px}h1{font-size:36px;letter-spacing:5px;margin-bottom:7px}p{line-height:1.6;font-size:13px}progress{width:280px;max-width:80vw;accent-color:#08776b;margin:15px auto}#error{white-space:pre-wrap;max-width:600px;overflow-wrap:anywhere}a{color:#08776b}</style></head><body>
<canvas id="unity-canvas" tabindex="0" aria-label="DHARA interactive environmental simulation"></canvas>
<div id="loading"><h1>DHARA</h1><p>A LIVING CITY</p><progress id="progress" max="1" value="0"></progress><p id="status">Loading the interactive city…</p><p id="error" role="alert"></p><a href="../">Back to the project</a></div>
<script>
const canvas=document.getElementById('unity-canvas');
function resize(){canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}
resize();addEventListener('resize',resize);
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},devicePixelRatio:Math.min(devicePixelRatio||1,1.5)};
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
function fail(message){document.getElementById('status').textContent='The city could not start.';document.getElementById('error').textContent=String(message);}
script.onerror=()=>fail('The application files could not be loaded. Check your connection and reload.');
script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(instance=>{document.getElementById('loading').style.display='none';canvas.focus();}).catch(fail);
document.body.append(script);
</script></body></html>
